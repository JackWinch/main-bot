name: Docs

on:
  schedule:
    - cron: "0 3 * * 4" # every Thursday at 03:00
      timezone: "Europe/Bucharest" # handles summer/winter time automatically
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs image
        run: docker build -t main-bot-dev -f Dockerfile .

      - name: Build docs
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            main-bot-dev \
            sphinx-build -b html docs/source docs/build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
