name: Scheduled release

on:
  schedule:
    - cron: "10 20 * * *" # every day at 20:10
      timezone: "Europe/Bucharest" # handles summer/winter time automatically
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, needed for the commit list

      - name: Build release name
        id: name
        env:
          TZ: Europe/Bucharest
        run: |
          YY=$(date +%g)                        # ISO year, 2 digits (26)
          CW=$(date +%V)                        # ISO calendar week (01-53)
          DD=$(printf '%02d' $(( $(date +%w) + 1 )))  # Sunday=01 ... Saturday=07
          echo "tag=preview-${YY}cw${CW}-${DD}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          # Most recent previous release (if any)
          PREV=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')

          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            echo "## Pull requests since $PREV" > notes.md
          else
            RANGE="HEAD"
            echo "## Pull requests" > notes.md
          fi
          echo >> notes.md

          # For each commit in the range, find the merged PR it came from
          : > prs.tsv
          : > direct.md
          for SHA in $(git log "$RANGE" --pretty=%H); do
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"$BRANCH\")][0]
                    | select(. != null) | \"\(.number)\t\(.user.login)\t\(.title)\"")
            if [ -n "$PR" ]; then
              echo "$PR" >> prs.tsv
            else
              # Commit pushed straight to the branch, not via a PR
              git log -1 --no-merges --pretty='- %s (%h)' "$SHA" >> direct.md
            fi
          done

          if [ -s prs.tsv ]; then
            sort -t $'\t' -k1,1n -u prs.tsv \
              | awk -F '\t' '{ print "- #" $1 " @" $2 " " $3 }' >> notes.md
          else
            echo "No new pull requests." >> notes.md
          fi

          if [ -s direct.md ]; then
            printf '\n## Commits without a pull request\n\n' >> notes.md
            cat direct.md >> notes.md
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --target "${{ github.sha }}"
